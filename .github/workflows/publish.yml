name: Build and Publish Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  JAVA_VERSION: 21

jobs:
  extract-metadata:
    name: Extract Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      minecraft_versions: ${{ steps.version.outputs.minecraft_versions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [ -z "$VERSION" ]; then
            echo "Release tag must not be empty." >&2
            exit 1
          fi
          if [ -z "$RELEASE_NOTES" ]; then
            echo "Release notes are required for Modrinth version changelogs." >&2
            exit 1
          fi
          jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' \
            .github/minecraft-versions.json >/dev/null
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          printf 'minecraft_versions=%s\n' "$(jq -c . .github/minecraft-versions.json)" >> "$GITHUB_OUTPUT"
          echo "Using version: $VERSION"

  build-and-publish:
    name: Build & Publish (${{ matrix.minecraft_version }})
    needs: extract-metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        minecraft_version: ${{ fromJson(needs.extract-metadata.outputs.minecraft_versions) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build mod JAR
        env:
          MOD_VERSION: ${{ needs.extract-metadata.outputs.version }}
          MINECRAFT_VERSION: ${{ matrix.minecraft_version }}
        run: |
          ./gradlew clean remapJar \
            -Pmod_version="$MOD_VERSION" \
            -Pminecraft_version="$MINECRAFT_VERSION" \
            --no-daemon

      - name: Rename JAR with proper versioning
        env:
          MOD_VERSION: ${{ needs.extract-metadata.outputs.version }}
          MINECRAFT_VERSION: ${{ matrix.minecraft_version }}
        run: |
          cd build/libs
          ORIGINAL_JAR=$(find . -name "lite2edit-*.jar" -not -name "*-sources.jar" | head -1)
          if [ -n "$ORIGINAL_JAR" ]; then
            NEW_NAME="lite2edit-fabric-${MINECRAFT_VERSION}-${MOD_VERSION}.jar"
            mv "$ORIGINAL_JAR" "$NEW_NAME"
            echo "Renamed $ORIGINAL_JAR to $NEW_NAME"
          else
            echo "Error: No JAR file found!"
            ls -la
            exit 1
          fi

      - name: Upload JAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lite2edit-fabric-${{ matrix.minecraft_version }}-${{ needs.extract-metadata.outputs.version }}
          path: build/libs/lite2edit-fabric-${{ matrix.minecraft_version }}-${{ needs.extract-metadata.outputs.version }}.jar

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_ID: ${{ secrets.MODRINTH_ID }}
          MODRINTH_CHANGELOG: ${{ github.event.release.body }}
          MOD_VERSION: ${{ needs.extract-metadata.outputs.version }}
          MINECRAFT_VERSION: ${{ matrix.minecraft_version }}
        run: |
          ./gradlew modrinth \
            -Pmod_version="$MOD_VERSION" \
            -Pminecraft_version="$MINECRAFT_VERSION" \
            --no-daemon

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          MOD_VERSION: ${{ needs.extract-metadata.outputs.version }}
          MINECRAFT_VERSION: ${{ matrix.minecraft_version }}
        run: |
          ./gradlew publish \
            -Pmod_version="$MOD_VERSION" \
            -Pminecraft_version="$MINECRAFT_VERSION" \
            --no-daemon

  sync-modrinth-description:
    name: Sync Modrinth project description
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Sync README to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_ID: ${{ secrets.MODRINTH_ID }}
        run: ./gradlew modrinthSyncBody --no-daemon

  attach-to-release:
    name: Attach JARs to Release
    needs: [extract-metadata, build-and-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all mod JARs
        uses: actions/download-artifact@v4
        with:
          pattern: lite2edit-*
          merge-multiple: true

      - name: List downloaded JAR files
        run: |
          echo "Downloaded mod JARs:"
          find . -name "*.jar" -type f | sort

      - name: Attach all mod JARs to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: "lite2edit-*.jar"
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true
