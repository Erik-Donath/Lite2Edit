name: CI & Code Quality

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-matrix:
    name: Prepare Minecraft version matrix
    runs-on: ubuntu-latest
    outputs:
      minecraft_versions: ${{ steps.versions.outputs.minecraft_versions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read supported versions
        id: versions
        run: |
          jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' \
            .github/minecraft-versions.json >/dev/null
          printf 'minecraft_versions=%s\n' "$(jq -c . .github/minecraft-versions.json)" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build & Test (${{ matrix.minecraft_version }})
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft_version: ${{ fromJson(needs.prepare-matrix.outputs.minecraft_versions) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Test and build project
        run: ./gradlew test build generatePomFileForMavenPublication -Pminecraft_version=${{ matrix.minecraft_version }}

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-artifacts-${{ matrix.minecraft_version }}
          path: |
            build/libs/
            build/publications/maven/pom-default.xml
          retention-days: 7

  qodana:
    name: Qodana Code Quality Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Qodana Scan
        id: qodana
        uses: JetBrains/qodana-action@v2025.3
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          pr-mode: ${{ github.event_name == 'pull_request' }}
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          upload-result: true
          push-fixes: 'none'

      - name: Upload SARIF to GitHub Code Scanning
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          category: qodana